name: CI

on:
  push:
  pull_request:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential xorriso mtools dosfstools qemu-system-x86

      - name: Build kernel
        run: make

      - name: Build ISO
        run: make iso

      - name: Boot smoke test
        run: ./tools/smoke-test.sh
